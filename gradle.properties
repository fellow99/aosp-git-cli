# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
# CLI 制品版本 = 工具上游版本 = Maven 坐标 version（独立 semver，见 docs/000-工程规划.md）。
# 多版本发布：-PCLI_VERSION=<git 版本>（见 git-cli.lock.json 的 releases）。
# 当前值为 draft 计划版本；首个真实 CI 构建后按 lock 回写事实。
CLI_VERSION=2.56.0
POM_NAME=git-cli
POM_DESCRIPTION=git command-line executable (libgit_cli.so) for Android arm64-v8a - cross-compiled from the official git source with statically linked zlib/curl/OpenSSL for https transport
POM_URL=https://github.com/fellow99/aosp-git-cli
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-git-cli.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-git-cli.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
